name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Monday at 00:00 UTC to catch upstream dependency drift
    - cron: '0 0 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-math:
    name: Markdown LaTeX Lint & AST Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify with mdmathlint (Official GitHub Math Linter)
        run: npx --yes mdmathlint --profile github README.md README_zh.md

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install Lint Dependencies
        run: uv pip install markdown-it-py pytest

      - name: Run Markdown AST Integrity & GFM LaTeX Tests
        run: |
          python scripts/check_markdown_math.py
          pytest tests/test_readme_latex.py -v

  ruff-lint:
    name: Python Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Run Ruff Linter
        uses: astral-sh/ruff-action@v4.1.0

  type-check:
    name: Python Static Typing (Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          uv pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Run Mypy Type Checker on Core Implementation
        run: mypy src/

  lean:
    name: Lean 4 Interactive Theorem Prover
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build & Verify Lean 4 Formal Proofs
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: "formal_verification"

  security-audit:
    name: Python Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Run PyPA pip-audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt

  paper-audit:
    name: Paper Integrity, Claims & Formula Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install Paper Verification Tools
        run: uv pip install arxiv-latex-cleaner bibtexparser pandas jinja2 tabulate sympy

      - name: Verify arXiv Cleaner Compliance (Google Research Tool)
        run: arxiv_latex_cleaner paper --keep_bib

      - name: Verify LaTeX Citations, Terminology & Claims Audit
        run: |
          python scripts/generate_paper_tables.py
          python scripts/check_paper_integrity.py main.tex
          python scripts/check_paper_integrity.py main_zh.tex
          python scripts/verify_paper_claims.py
          python scripts/verify_formula_with_sympy.py

  compile-latex:
    name: Compile Preprint (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "English"
            file: "main.tex"
            engine: "-pdf -file-line-error -halt-on-error -interaction=nonstopmode"
            check_warnings: true
            allow_failure: false
          - target: "Chinese"
            file: "main_zh.tex"
            engine: "-xelatex -file-line-error -interaction=nonstopmode"
            check_warnings: false
            allow_failure: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Compile Preprint PDF
        uses: xu-cheng/latex-action@v3
        continue-on-error: ${{ matrix.allow_failure }}
        with:
          root_file: ${{ matrix.file }}
          working_directory: paper
          args: ${{ matrix.engine }}
          post_compile: |
            if [ "${{ matrix.check_warnings }}" = "true" ]; then
              bash ../scripts/check_latex_warnings.sh main.log
            fi

      - name: Verify Compiled PDF Output
        run: |
          PDF_TARGET="paper/${{ matrix.file == 'main.tex' && 'main.pdf' || 'main_zh.pdf' }}"
          if [ -f "$PDF_TARGET" ]; then
            echo "[✓] Successfully verified preprint binary: $PDF_TARGET ($(stat -c%s "$PDF_TARGET") bytes)"
          else
            if [ "${{ matrix.allow_failure }}" = "true" ]; then
              echo "::warning::Preprint PDF $PDF_TARGET was not generated by XeLaTeX."
            else
              echo "::error::Required preprint PDF $PDF_TARGET was not generated!"
              exit 1
            fi
          fi

      - name: Archive Compiled PDF
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: paper-${{ matrix.target }}-pdf
          path: paper/${{ matrix.file == 'main.tex' && 'main.pdf' || 'main_zh.pdf' }}
          if-no-files-found: ${{ matrix.allow_failure && 'warn' || 'error' }}

  tests:
    name: Test Suite & Formal Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          uv pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Run Pytest Test Suite with Coverage
        run: pytest tests/ -n auto --cov=src --cov-report=term-missing -v

      - name: Run Formal Verification & Property Fuzzing
        run: python formal_verification/verify_properties.py
