name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-math:
    name: Markdown LaTeX Lint & AST Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify with mdmathlint (Official GitHub Math Linter)
        run: npx --yes mdmathlint --profile github README.md README_zh.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lint Dependencies
        run: pip install markdown-it-py pytest

      - name: Run Markdown AST Integrity & GFM LaTeX Tests
        run: |
          python scripts/check_markdown_math.py
          pytest tests/test_readme_latex.py -v

  latex:
    name: Build & Validate LaTeX Paper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile LaTeX Preprint
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper

      - name: Archive Compiled Preprint PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/main.pdf

  tests:
    name: Test Suite & Formal Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: pytest tests/ -v

      - name: Run Formal Verification & Property Fuzzing
        run: python formal_verification/verify_properties.py
