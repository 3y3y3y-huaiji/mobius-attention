name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-math:
    name: Markdown LaTeX Lint & AST Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify with mdmathlint (Official GitHub Math Linter)
        run: npx --yes mdmathlint --profile github README.md README_zh.md

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Lint Dependencies
        run: pip install markdown-it-py pytest

      - name: Run Markdown AST Integrity & GFM LaTeX Tests
        run: |
          python scripts/check_markdown_math.py
          pytest tests/test_readme_latex.py -v

  ruff-lint:
    name: Python Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Run Ruff Linter
        uses: astral-sh/ruff-action@v4.1.0

  lean:
    name: Lean 4 Interactive Theorem Prover
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build & Verify Lean 4 Formal Proofs
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: "formal_verification"

  security-audit:
    name: Python Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Run PyPA pip-audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt

  latex:
    name: Build & Validate LaTeX Paper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Paper Verification Tools
        run: pip install arxiv-latex-cleaner bibtexparser pandas jinja2 tabulate

      - name: Verify arXiv Cleaner Compliance (Google Research Tool)
        run: arxiv_latex_cleaner paper --keep_bib

      - name: Verify LaTeX Citations & Anti-Hallucination Audit
        run: |
          python scripts/generate_paper_tables.py
          python scripts/check_paper_integrity.py main.tex
          python scripts/check_paper_integrity.py main_zh.tex
          python scripts/verify_paper_claims.py

      - name: Compile LaTeX Preprint with Strict Zero-Warning Enforcement
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          args: "-pdf -file-line-error -halt-on-error -interaction=nonstopmode"
          post_compile: |
            if grep -E "LaTeX Warning: (Citation .* undefined|Reference .* undefined|There were undefined references)" main.log; then
              echo "::error::Undefined citations or references detected in LaTeX log!"
              exit 1
            fi

      - name: Compile Chinese LaTeX Paper (Best Effort with XeLaTeX)
        uses: xu-cheng/latex-action@v3
        continue-on-error: true
        with:
          root_file: main_zh.tex
          working_directory: paper
          args: "-xelatex -file-line-error -interaction=nonstopmode"

      - name: Archive Compiled Preprint PDFs (English & Chinese)
        uses: actions/upload-artifact@v6
        with:
          name: paper-pdf
          path: |
            paper/main.pdf
            paper/main_zh.pdf

  tests:
    name: Test Suite & Formal Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: pytest tests/ -v

      - name: Run Formal Verification & Property Fuzzing
        run: python formal_verification/verify_properties.py
